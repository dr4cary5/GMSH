name: Deploy MSHW-RemoteBrowser

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      PROXY_PORT: 8080

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, curl, json, openssl, xml, zip
          coverage: none

      - name: 📦 Install Dependencies
        run: composer install --no-dev --optimize-autoloader --quiet

      - name: 🚀 Start PHP Server
        run: |
          nohup php -S 0.0.0.0:${{ env.PROXY_PORT }} -t public/ > /tmp/php.log 2>&1 &
          sleep 3
          curl -s http://localhost:${{ env.PROXY_PORT }}/ > /dev/null && echo "✅ PHP Server Ready" || echo "❌ PHP Failed"

      - name: 🛠️ Install & Start Ngrok
        run: |
          # Official installation method
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok
          
      - name: 📦 Install Dependencies + Dump Autoload
        run: |
          composer install --no-dev --optimize-autoloader --quiet
          composer dump-autoload --optimize --quiet  # ← این خط حیاتی است
          # Configure auth
          ngrok config add-authtoken $NGROK_AUTH_TOKEN

          # Start single tunnel (Free Tier Compatible)
          nohup ngrok http ${{ env.PROXY_PORT }} --log=stdout > /tmp/ngrok.log 2>&1 &
          echo "⏳ Waiting for ngrok tunnel..."
          sleep 12

          # Verify tunnel
          if ! pgrep -x "ngrok" > /dev/null; then
            echo "❌ Ngrok failed to start. Logs:"
            cat /tmp/ngrok.log
            exit 1
          fi

      - name: 🌐 Extract & Display URL
        run: |
          sleep 5
          PROXY_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')

          if [ -z "$PROXY_URL" ] || [ "$PROXY_URL" = "null" ]; then
            echo "❌ Failed to extract URL. Check ngrok logs."
            cat /tmp/ngrok.log
            exit 1
          fi

          echo "========================================="
          echo "🎉 MSHW-RemoteBrowser Deployed!"
          echo "🌐 Live URL: $PROXY_URL"
          echo "========================================="

          echo "## 🎉 MSHW-RemoteBrowser Live" >> $GITHUB_STEP_SUMMARY
          echo "- **Proxy URL:** [$PROXY_URL]($PROXY_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Running on GitHub Actions (6h max)" >> $GITHUB_STEP_SUMMARY

      - name: ♻️ Keep-Alive & Health Monitor
        run: |
          echo "🔄 Starting health monitor..."
          while true; do
            # Restart PHP if down
            if ! pgrep -f "php -S" > /dev/null; then
              echo "⚠️ PHP restarted"
              nohup php -S 0.0.0.0:${{ env.PROXY_PORT }} -t public/ > /tmp/php.log 2>&1 &
            fi
            # Restart Ngrok if down
            if ! pgrep -x "ngrok" > /dev/null; then
              echo "⚠️ Ngrok restarted"
              nohup ngrok http ${{ env.PROXY_PORT }} --log=stdout > /tmp/ngrok.log 2>&1 &
            fi
            echo "[$(date '+%H:%M:%S')] 💓 Heartbeat OK"
            sleep 300
          done
